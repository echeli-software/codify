# Local dev stack (docs/13-deployment.md §13).
#   pnpm db:up                                       → Postgres + Redis (default)
#   docker compose -f docker-compose.dev.yml --profile mail up -d     → + Mailpit (SMTP :1025, UI :8025)
#   docker compose -f docker-compose.dev.yml --profile judge0 up -d   → + Judge0 on :2358
# Judge0 needs a Linux Docker host with cgroup v1 (see infra/judge0/README.md);
# without it the API's in-process dev executor is used (leave JUDGE0_URL unset).

services:
  postgres:
    image: postgres:16-alpine
    container_name: codify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codify
      POSTGRES_PASSWORD: codify
      POSTGRES_DB: codify_dev
    ports:
      # Non-default host port so codify can coexist with other projects'
      # Postgres containers on 5432. App-side DATABASE_URL must match.
      - '55432:5432'
    volumes:
      - codify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codify -d codify_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codify-redis
    restart: unless-stopped
    ports:
      - '56379:6379'
    volumes:
      - codify_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: codify-mailpit
    profiles: [mail]
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # ── Judge0 (optional; mirrors infra/judge0 with dev credentials) ───────────
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: codify-judge0
    profiles: [judge0]
    privileged: true
    restart: unless-stopped
    environment: &judge0-env
      AUTHN_HEADER: X-Auth-Token
      AUTHN_TOKEN: dev-judge0-token
      ENABLE_NETWORK: 'false'
      ALLOW_ENABLE_NETWORK: 'false'
      ENABLE_CALLBACKS: 'false'
      ENABLE_WAIT_RESULT: 'true'
      CPU_TIME_LIMIT: '2'
      WALL_TIME_LIMIT: '5'
      MEMORY_LIMIT: '128000'
      MAX_PROCESSES_AND_OR_THREADS: '30'
      MAX_FILE_SIZE: '64'
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: judge0
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    ports:
      - '2358:2358'
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: [judge0]
    privileged: true
    restart: unless-stopped
    command: ['./scripts/workers']
    environment: *judge0-env
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16-alpine
    profiles: [judge0]
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0

  judge0-redis:
    image: redis:7-alpine
    profiles: [judge0]
    restart: unless-stopped
    command: ['redis-server', '--requirepass', 'judge0']

volumes:
  codify_pg_data:
  codify_redis_data:
