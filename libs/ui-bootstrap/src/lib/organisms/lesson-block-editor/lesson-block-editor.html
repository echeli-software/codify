<div
  class="cdf-lesson-editor"
  [class.cdf-lesson-editor--readonly]="isReadonly()"
>
  @if (!isReadonly()) {
  <div class="cdf-lesson-editor__chrome">
    <cdf-block-toolbar
      [state]="toolbarState()"
      (toolbarCommand)="runCommand($event)"
      (calloutKindChange)="setCalloutKind($event)"
    />
    @switch (panel()) { @case ('link') {
    <cdf-link-panel
      [initialHref]="link().href"
      [initialNewTab]="link().newTab"
      [hasLink]="link().hasLink"
      (apply)="applyLink($event)"
      (unlink)="removeLink()"
      (dismiss)="closePanel()"
    />
    } @case ('image') {
    <cdf-image-panel (insert)="insertImage($event)" (dismiss)="closePanel()" />
    } @case ('embed') {
    <cdf-embed-panel (insert)="insertEmbed($event)" (dismiss)="closePanel()" />
    } }
  </div>
  }

  <div class="cdf-lesson-editor__body">
    <div #editorHost class="cdf-lesson-editor__surface"></div>
    @if (menu(); as m) {
    <cdf-block-menu
      class="cdf-lesson-editor__menu"
      [style.top.px]="m.top"
      [style.left.px]="m.left"
      (pick)="insertBlock($event)"
      (dismiss)="closeMenu()"
    />
    }
  </div>

  <p class="cdf-lesson-editor__sr" aria-live="polite">{{ announcement() }}</p>
</div>
