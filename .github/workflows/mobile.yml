name: Mobile

# Signed native builds of the student app (docs/13 §4, docs/17-mobile.md,
# roadmap Phase 11): tag `mobile-v*` or run manually.
#   web      production PWA build (the Capacitor webDir) → artifact
#   android  cap sync → bundleRelease signed with the upload keystore → Play internal (fastlane supply)
#   ios      cap sync → fastlane match + gym → TestFlight (fastlane pilot)
# Each platform skips with a summary when its signing/store secrets are absent.
# Production submission stays manual after QA (`fastlane android promote`, App Store Connect).

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER || 'app.codify.student' }}
  ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'app.codify.student' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in mobile-v*) v="${ref#mobile-v}" ;; *) v="0.0.${GITHUB_RUN_NUMBER}" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build student (production API)
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}
        run: bash infra/web/build-frontend.sh student "${{ vars.PROD_API_URL || 'https://api.codify.app/api' }}" none

      - uses: actions/upload-artifact@v4
        with:
          name: student-web
          path: dist/apps/student/browser
          retention-days: 3

  android:
    needs: web
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      VERSION_NAME: ${{ needs.web.outputs.version }}
    steps:
      - name: Preflight
        id: preflight
        run: |
          missing=()
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do [ -n "${!v}" ] || missing+=("ANDROID_${v#ANDROID_}"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            { echo "### Android skipped"; echo "Signing secrets not configured: ${missing[*]} (see infra/README.md → Mobile)."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Android skipped::Signing secrets not configured"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else echo "upload=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.build == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          node-version: 22
          cache: 'pnpm'
      - if: steps.preflight.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          name: student-web
          path: dist/apps/student/browser
      - uses: actions/setup-java@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Capacitor sync (android)
        if: steps.preflight.outputs.build == 'true'
        working-directory: apps/student
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Version code / name
        if: steps.preflight.outputs.build == 'true'
        working-directory: apps/student/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: bundleRelease (signed)
        if: steps.preflight.outputs.build == 'true'
        working-directory: apps/student/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          name: android-aab
          path: apps/student/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: ruby/setup-ruby@v1
        if: steps.preflight.outputs.build == 'true' && steps.preflight.outputs.upload == 'true'
        with:
          ruby-version: '3.3'

      - name: Upload to Play internal testing (fastlane supply)
        if: steps.preflight.outputs.build == 'true' && steps.preflight.outputs.upload == 'true'
        working-directory: apps/student
        env:
          AAB_PATH: ${{ github.workspace }}/apps/student/android/app/build/outputs/bundle/release/app-release.aab
        run: |
          gem install fastlane --no-document
          fastlane android internal

      - name: Summary
        if: steps.preflight.outputs.build == 'true'
        run: |
          echo "### Android ${VERSION_NAME} (${GITHUB_RUN_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.preflight.outputs.upload }}" = "true" ]; then
            echo "Uploaded to Play internal testing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed AAB attached as an artifact; PLAY_SERVICE_ACCOUNT_JSON not set, so no upload." >> "$GITHUB_STEP_SUMMARY"
          fi

  ios:
    needs: web
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_P8_BASE64: 'true'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VERSION_NAME: ${{ needs.web.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - name: Preflight
        id: preflight
        run: |
          missing=""
          for v in MATCH_GIT_URL MATCH_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            eval "val=\${$v}"; [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            { echo "### iOS skipped"; echo "Not configured:$missing (see infra/README.md → Mobile)."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=iOS skipped::Signing / App Store Connect secrets not configured"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.build == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          node-version: 22
          cache: 'pnpm'
      - if: steps.preflight.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.preflight.outputs.build == 'true'
        with:
          name: student-web
          path: dist/apps/student/browser

      - name: Capacitor sync (ios)
        if: steps.preflight.outputs.build == 'true'
        working-directory: apps/student
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - uses: ruby/setup-ruby@v1
        if: steps.preflight.outputs.build == 'true'
        with:
          ruby-version: '3.3'

      - name: match + gym + pilot → TestFlight
        if: steps.preflight.outputs.build == 'true'
        working-directory: apps/student
        run: |
          gem install fastlane --no-document
          fastlane ios beta

      - name: Summary
        if: steps.preflight.outputs.build == 'true'
        run: echo "### iOS ${VERSION_NAME} (${BUILD_NUMBER}) uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
