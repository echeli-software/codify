name: Preview

# Per-PR previews of admin + student on Cloudflare Pages (docs/13 §3, roadmap
# Phase 0: "A PR opened by a contributor produces a preview URL for both apps").
# Deploys to the *staging* Pages projects as branch `pr-<number>` so each PR
# gets stable aliases: https://pr-<n>.<project>.pages.dev
#
# Needs: secret CLOUDFLARE_API_TOKEN (Pages:Edit), variable CLOUDFLARE_ACCOUNT_ID.
# Optional variables: PREVIEW_API_URL (default staging API),
# PAGES_PROJECT_STUDENT_STAGING / PAGES_PROJECT_ADMIN_STAGING.
# Without the token (forks, fresh clones) the workflow skips with a notice.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.PREVIEW_API_URL || 'https://api.staging.codify.app/api' }}
      STUDENT_PROJECT: ${{ vars.PAGES_PROJECT_STUDENT_STAGING || 'codify-student-staging' }}
      ADMIN_PROJECT: ${{ vars.PAGES_PROJECT_ADMIN_STAGING || 'codify-admin-staging' }}
      BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Preflight
        id: preflight
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::CLOUDFLARE_API_TOKEN secret / CLOUDFLARE_ACCOUNT_ID variable not configured (normal for forks)."
            {
              echo "### Preview skipped"
              echo "Cloudflare credentials are not available to this run (fork PR or not configured)."
              echo "See infra/README.md → GitHub configuration."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        if: steps.preflight.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build student + admin
        if: steps.preflight.outputs.enabled == 'true'
        env:
          # Public key; unset = dev role-picker login.
          CLERK_PUBLISHABLE_KEY: ${{ vars.STAGING_CLERK_PUBLISHABLE_KEY }}
        run: |
          bash infra/web/build-frontend.sh student "$API_URL" pages
          bash infra/web/build-frontend.sh admin "$API_URL" pages

      - name: Deploy student preview
        id: student
        if: steps.preflight.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/student/browser --project-name=${{ env.STUDENT_PROJECT }} --branch=${{ env.BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Deploy admin preview
        id: admin
        if: steps.preflight.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/admin/browser --project-name=${{ env.ADMIN_PROJECT }} --branch=${{ env.BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Comment preview URLs
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          STUDENT_URL: ${{ steps.student.outputs.deployment-url }}
          STUDENT_ALIAS: ${{ steps.student.outputs.pages-deployment-alias-url }}
          ADMIN_URL: ${{ steps.admin.outputs.deployment-url }}
          ADMIN_ALIAS: ${{ steps.admin.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- codify-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const row = (name, alias, url) =>
              `| ${name} | ${alias ? `[${alias}](${alias})` : '—'} | ${url ? `[this commit](${url})` : '—'} |`;
            const body = [
              marker,
              `### Preview deployments for \`${sha}\``,
              '',
              '| App | Branch alias | Immutable |',
              '|---|---|---|',
              row('Student PWA', process.env.STUDENT_ALIAS, process.env.STUDENT_URL),
              row('Admin', process.env.ADMIN_ALIAS, process.env.ADMIN_URL),
              '',
              `API: \`${process.env.API_URL}\` (staging). Sign in with staging Clerk users.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            await core.summary.addRaw(body.replace(marker, '')).write();
