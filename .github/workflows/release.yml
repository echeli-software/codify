name: Release

# Tag `v*` → production (docs/13 §9–10, roadmap Phase 0: "Tagging v0.0.1
# deploys to prod with a manual approval gate").
#
#   image    build + push ghcr.io/<owner>/codify-api:{vX.Y.Z,sha}
#   deploy   ⏸ environment `production` (required reviewers) → migrate on
#            vps-app-01 → promote the image to :production → Coolify deploy → smoke
#   web      admin + student → Pages production deployments
#   notes    GitHub release with generated notes (+ optional Slack post)
#
# Missing secrets make the affected steps skip with a summary.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.name.outputs.repo }}
      image: ${{ steps.name.outputs.repo }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codify-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max
          sbom: true

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual approval gate: configure required reviewers on this environment.
    environment:
      name: production
      url: ${{ vars.PROD_API_URL || 'https://api.codify.app/api' }}/health
    permissions:
      contents: read
      packages: write
    outputs:
      deployed: ${{ steps.preflight.outputs.enabled }}
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      REPO: ${{ needs.image.outputs.repo }}
      API_URL: ${{ vars.PROD_API_URL || 'https://api.codify.app/api' }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ vars.PROD_SSH_USER || 'deploy' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      COOLIFY_WEBHOOK_URL: ${{ secrets.PROD_COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        id: preflight
        run: |
          ok=true
          for v in DATABASE_URL SSH_HOST SSH_PRIVATE_KEY SSH_KNOWN_HOSTS COOLIFY_WEBHOOK_URL COOLIFY_TOKEN; do
            if [ -z "${!v}" ]; then ok=false; echo "- \`$v\` (environment \`production\`)" >> "$RUNNER_TEMP/missing"; fi
          done
          echo "enabled=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            {
              echo "### Production deploy skipped"
              echo "The image \`$IMAGE\` was pushed, but these are not configured:"
              cat "$RUNNER_TEMP/missing"
              echo
              echo "Production needs migrations, Coolify and the smoke test together — nothing was changed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Production deploy skipped::Secrets missing — see the job summary."
          fi

      - name: Migrate production database (prisma migrate deploy on vps-app-01)
        if: steps.preflight.outputs.enabled == 'true'
        run: infra/deploy/remote-migrate.sh

      - uses: docker/login-action@v3
        if: steps.preflight.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Coolify's production resource tracks the mutable :production tag; it
      # only moves after approval + successful migrations. Roll back by
      # re-tagging a previous vX.Y.Z and re-running the Coolify deploy.
      - name: Promote image to :production
        if: steps.preflight.outputs.enabled == 'true'
        run: docker buildx imagetools create --tag "$REPO:production" "$IMAGE"

      - name: Trigger Coolify deploy
        if: steps.preflight.outputs.enabled == 'true'
        run: infra/deploy/coolify-deploy.sh

      - name: Smoke /api/health
        if: steps.preflight.outputs.enabled == 'true'
        run: infra/deploy/smoke.sh "$API_URL" 600

  # No `environment:` here on purpose: it would ask reviewers to approve a
  # second time. The job only runs after the approved `deploy` job succeeded,
  # and uses repository-level secrets/variables.
  web:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.PROD_API_URL || 'https://api.codify.app/api' }}
      STUDENT_PROJECT: ${{ vars.PAGES_PROJECT_STUDENT || 'codify-student' }}
      ADMIN_PROJECT: ${{ vars.PAGES_PROJECT_ADMIN || 'codify-admin' }}
      PAGES_BRANCH: ${{ vars.PAGES_PRODUCTION_BRANCH || 'main' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
    steps:
      - name: Preflight
        id: preflight
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Production web skipped — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: 'pnpm'
      - if: steps.preflight.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build student + admin
        if: steps.preflight.outputs.enabled == 'true'
        env:
          # Public key; unset = dev role-picker login.
          CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}
        run: |
          bash infra/web/build-frontend.sh student "$API_URL" pages
          bash infra/web/build-frontend.sh admin "$API_URL" pages

      # Optional: upload source maps when the apps emit them (docs/13 §12).
      - name: Upload source maps to Sentry
        if: steps.preflight.outputs.enabled == 'true' && env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != ''
        run: |
          for app in student admin; do
            if ls dist/apps/$app/browser/*.map >/dev/null 2>&1; then
              npx --yes @sentry/cli@2 sourcemaps upload --org "$SENTRY_ORG" --project "codify-$app" \
                --release "$GITHUB_REF_NAME" "dist/apps/$app/browser"
              rm -f dist/apps/$app/browser/*.map
            fi
          done

      - name: Deploy student (production)
        if: steps.preflight.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/student/browser --project-name=${{ env.STUDENT_PROJECT }} --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.sha }}

      - name: Deploy admin (production)
        if: steps.preflight.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/admin/browser --project-name=${{ env.ADMIN_PROJECT }} --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.sha }}

  notes:
    needs: [deploy, web]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with generated notes
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          echo "### Release [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          jq -n --arg text ":rocket: Codify $GITHUB_REF_NAME is live — <$url|release notes>" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
