<cdf-breadcrumb-bar [crumbs]="crumbs" />

<header class="page-head">
  <div class="page-head__left">
    <cdf-form-field label="Lesson title" [required]="true">
      <cdf-input [(ngModel)]="title" placeholder="Lesson title" />
    </cdf-form-field>
    <p class="muted small">{{ blockCount() }} blocks · v{{ doc().version }}</p>
  </div>
  <div class="page-head__right">
    <fieldset class="mode-toggle" role="radiogroup" aria-label="View mode">
      <button
        type="button"
        [class.active]="previewMode() === 'edit'"
        (click)="setMode('edit')"
      >Edit</button>
      <button
        type="button"
        [class.active]="previewMode() === 'split'"
        (click)="setMode('split')"
      >Split</button>
      <button
        type="button"
        [class.active]="previewMode() === 'preview'"
        (click)="setMode('preview')"
      >Preview</button>
    </fieldset>

    <cdf-button kind="ghost" (click)="loadEmpty()">Empty</cdf-button>
    <cdf-button kind="ghost" (click)="loadSample()">Reset sample</cdf-button>
    <cdf-button kind="primary" (click)="save()">
      <cdf-icon name="check" size="sm" /> Save
    </cdf-button>
  </div>
</header>

<cdf-divider [inset]="true" />

<div class="editor-grid" [class]="'editor-grid--' + previewMode()">
  @if (previewMode() !== 'preview') {
  <section class="editor-grid__pane">
    <h2 class="pane-title">Editor</h2>
    <cdf-lesson-block-editor [(ngModel)]="doc" />
  </section>
  }
  @if (previewMode() !== 'edit') {
  <section class="editor-grid__pane">
    <h2 class="pane-title">Preview</h2>
    <article class="cdf-prose">
      <cdf-lesson-block-renderer [doc]="doc()" />
    </article>
  </section>
  }
</div>
