<cdf-breadcrumb-bar [crumbs]="crumbs" />

<header class="page-head">
  <div>
    <h1>Courses</h1>
    <p class="muted">Manage published and draft courses across the catalog.</p>
  </div>
  <cdf-button kind="primary"><cdf-icon name="plus" size="sm" /> New course</cdf-button>
</header>

<div class="page-toolbar">
  <cdf-search-bar placeholder="Search by title, author, category…" (query)="onSearch($event)" />
  @if (selected().length > 0) {
  <span class="muted small">{{ selected().length }} selected</span>
  }
</div>

@if (filtered().length === 0) {
<cdf-empty-state
  icon="search"
  title="No matches"
  description="Try a different search term, or clear the filter to see all courses."
/>
} @else {
<cdf-data-table
  [rows]="visible()"
  [columns]="columns"
  [selectable]="true"
  (selectionChange)="onSelectionChange($event)"
  [rowActions]="actions"
>
  <ng-template cdfDataTableCell="status" let-row>
    <cdf-badge [variant]="statusVariant(row.status)" [subtle]="true">{{ row.status }}</cdf-badge>
  </ng-template>
</cdf-data-table>

<ng-template #actions let-row>
  <cdf-icon-button icon="pencil" ariaLabel="Edit" size="sm" kind="ghost" />
  <cdf-icon-button icon="trash" ariaLabel="Delete" size="sm" kind="danger" (click)="deleteRow(row)" />
</ng-template>

<div class="page-footer">
  <cdf-pagination
    [page]="page()"
    [totalPages]="totalPages()"
    (pageChange)="page.set($event)"
  />
</div>
}
