# Static SPA server for apps/admin and apps/student (Docker alternative to
# Cloudflare Pages). Runs as non-root on :8080 (nginxinc/nginx-unprivileged).
# Security headers come from /etc/nginx/snippets/security-headers.conf, rendered
# at image build time by infra/web/security-headers.mjs, and are included in
# every location because nginx drops inherited add_header directives in any
# location that declares its own.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml font/ttf;

    # Container healthcheck — no headers needed, not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles emitted by Angular (outputHashing: all) and
    # everything under /media/: cache forever.
    location ~* ^/(?:main|chunk|polyfills|styles|worker)-[A-Za-z0-9]+\.(?:js|mjs|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Angular service worker control files must always revalidate.
    location ~ ^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Unhashed static files (i18n JSON, icons, favicon): short cache.
    location ~* \.(?:json|ico|png|svg|webp|jpg|jpeg|gif|woff2?|ttf|txt|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # App shell + SPA fallback: every unknown path renders index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=600" always;
        try_files $uri $uri/ /index.html;
    }
}
