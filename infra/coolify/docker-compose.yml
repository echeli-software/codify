# Coolify "Docker Compose" resource for one environment (prod on vps-app-01,
# staging on vps-staging-01). Paste into Coolify → Project → + New → Docker
# Compose (empty), or point a Git-based compose resource at this file.
#
#   CODIFY_API_IMAGE   ghcr.io/<owner>/codify-api:production | :staging
#                      (moved by release.yml / staging.yml after migrations)
#
# Coolify injects every variable defined on the resource (Environment
# Variables tab) — see infra/coolify/README.md for the full list. Values here
# are only non-secret defaults.

services:
  api:
    image: ${CODIFY_API_IMAGE:?set CODIFY_API_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JOBS_ENABLED: 'false' # HTTP only; queues/crons run in `worker`
      DATABASE_URL: ${DATABASE_URL:?}
      # Everything else (Clerk, Stripe, R2, Judge0, Anthropic, FCM, Sentry,
      # CORS_ORIGINS, …) is set in Coolify and passed through as-is.
    expose:
      - '3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Domain (https://api.codify.app → port 3000) is set in the Coolify UI;
    # Coolify's proxy adds the routing labels.
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1536m }

  worker:
    image: ${CODIFY_API_IMAGE:?set CODIFY_API_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3001'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JOBS_ENABLED: 'true' # BullMQ consumers (submissions, push, emails) + @Cron jobs (league rollover, streaks, drift check)
      DATABASE_URL: ${DATABASE_URL:?}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1536m }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 640m }

volumes:
  redis-data:
